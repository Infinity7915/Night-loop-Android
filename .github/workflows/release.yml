name: Release

# Run from the Actions tab with a version like 0.1.0 (or push a tag like v0.1.0). Builds the Android app and
# publishes a GitHub Release with Night-loop-<version>.apk attached, using docs/releases/v<version>.md as notes.
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are
# set, the .apk is signed with that release key, so each release installs over the last one. Without them it is
# signed with a throwaway debug key (preview builds): installing a newer preview then needs the old one removed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.1.0 (tags the commit you run this on)"
        required: true
      prerelease:
        description: "Mark as a preview (pre-release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          v="${REQUESTED#v}"
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "Version must look like 0.1.0, got '$v'"; exit 1; fi
          # versionCode must grow with every release: 0.1.0 -> 100, 1.2.3 -> 10203.
          code=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          test -f "docs/releases/v$v.md" || { echo "Missing docs/releases/v$v.md"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the .NET Android workload
        run: dotnet workload install android

      - name: Install Android SDK parts the build needs
        run: >
          dotnet build src/NightLoop.Android/NightLoop.Android.csproj -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSdkLicenses=True

      - name: Release key (when the secrets are set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASS" ] && [ -n "$ALIAS" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGN_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=$ALIAS -p:AndroidSigningKeyPass=env:STORE_PASS -p:AndroidSigningStorePass=env:STORE_PASS"
              echo "STORE_PASS=$STORE_PASS"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key secrets: signing with a debug key (preview)."
          fi

      - name: Build the .apk
        run: |
          dotnet publish src/NightLoop.Android/NightLoop.Android.csproj -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationDisplayVersion=$VERSION -p:ApplicationVersion=$VERSION_CODE \
            $SIGN_ARGS -o out
          cp out/*-Signed.apk "Night-loop-$VERSION.apk"
          ls -la "Night-loop-$VERSION.apk"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          flags=()
          [ "$PRE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" "Night-loop-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "Night-loop for Android $VERSION" \
            --notes-file "docs/releases/v$VERSION.md" "${flags[@]}"
